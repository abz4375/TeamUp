services:
  postgres:
    image: postgres:16-alpine
    container_name: team_up_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-teamup}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - team_up_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: team_up_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - team_up_network
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: team_up_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_data:/data
    networks:
      - team_up_network
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit
    container_name: team_up_mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    networks:
      - team_up_network
    restart: unless-stopped

networks:
  team_up_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
